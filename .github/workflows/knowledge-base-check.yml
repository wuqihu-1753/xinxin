name: Core knowledge base structure check
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check retained folders and metadata
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -d '01-信息图形数据逻辑'
          test -d '02-信息图形类型案例'
          test -f '02-信息图形类型案例/00-案例索引.md'
